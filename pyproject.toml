[project]
name = "leyenda"
version = "0.1.0"
description = "TouNum Leyenda: photo filtering, denoising and automatic image captioning"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Deep learning (Keras 3 native, GPU via bundled CUDA wheels on Linux)
    "tensorflow[and-cuda]>=2.21 ; sys_platform == 'linux'",
    "tensorflow>=2.21 ; sys_platform != 'linux'",
    "keras>=3.15",
    # Data & numerics
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    # Images
    "imageio",
    "pillow",
    "scikit-image",   # PSNR / SSIM for denoising evaluation
    # Text / captioning
    "nltk",           # BLEU scores
    # Visualisation & architecture diagrams
    "matplotlib",
    "seaborn",
    "pydot",
    # Notebook tooling
    "ipykernel",
    "ipywidgets",
    "tqdm",
    "tensorboard>=2.21.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leyenda"]
